<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cue</title>
    <script>
      // Applied before first paint so there's no flash of the wrong theme — dark is the
      // default until the user explicitly toggles (see src/lib/theme-context.tsx).
      (function () {
        var stored = localStorage.getItem("watchrec_theme");
        document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
